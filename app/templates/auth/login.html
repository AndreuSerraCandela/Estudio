{% extends "base.html" %}

{% block title %}Iniciar sesión — Estudio{% endblock %}

{% block content %}
<div class="login-wrap">
  <div class="card login-card">
    <h1>Iniciar sesión</h1>
    <p class="muted">Usa las mismas credenciales que en Control de Presencia.</p>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="post" action="{{ url_for('auth.login_post', next=request.args.get('next')) }}" class="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="username"
               value="{{ email or '' }}">
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <label class="checkbox-row">
        <input type="checkbox" name="remember">
        Recordarme
      </label>
      <button type="submit" class="btn btn-primary btn-block">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
